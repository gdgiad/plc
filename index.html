<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC控制模拟：8位小灯控制</title>
    <style>
        /* 页面整体样式 - 走工业科技风 */
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #34495e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #1abc9c;
        }

        h1 {
            color: #1abc9c;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #95a5a6;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* 控制面板区域 */
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            align-items: center;
        }

        input[type="number"] {
            padding: 10px;
            font-size: 18px;
            width: 80px;
            border: 2px solid #1abc9c;
            border-radius: 5px;
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            outline: none;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #1abc9c;
            color: #2c3e50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #16a085;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        /* 小灯显示区域 */
        .lights-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .light-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* 小灯（圆圈）的样式 */
        .light {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #7f8c8d; /* 默认熄灭状态（灰色） */
            border: 3px solid #bdc3c7;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        /* 小灯点亮状态 */
        .light.on {
            background-color: #e74c3c; /* 亮红色 */
            border-color: #c0392b;
            box-shadow: 0 0 20px #e74c3c, inset 0 0 10px rgba(255,255,255,0.5);
        }

        .light-label {
            font-size: 14px;
            color: #95a5a6;
        }

        /* 错误提示信息 */
        .error-msg {
            color: #e74c3c;
            margin-top: 20px;
            height: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PLC 控制模拟系统</h1>
    <div class="subtitle">要求②：输入数字，显示对应小灯</div>

    <!-- 输入区 -->
    <div class="control-panel">
        <label for="numInput">输入数字 (1-8):</label>
        <input type="number" id="numInput" min="1" max="8" placeholder="如: 3">
        <button onclick="processInput()">执行控制</button>
        <button onclick="resetLights()" style="background-color: #95a5a6; color: #fff;">复位</button>
    </div>

    <!-- 8个小灯显示区 -->
    <div class="lights-container">
        <!-- 这是第1个小灯 -->
        <div class="light-box">
            <div class="light" id="light1"></div>
            <div class="light-label">灯 1</div>
        </div>
        <!-- 第2个小灯 -->
        <div class="light-box">
            <div class="light" id="light2"></div>
            <div class="light-label">灯 2</div>
        </div>
        <!-- 第3个小灯 -->
        <div class="light-box">
            <div class="light" id="light3"></div>
            <div class="light-label">灯 3</div>
        </div>
        <!-- 第4个小灯 -->
        <div class="light-box">
            <div class="light" id="light4"></div>
            <div class="light-label">灯 4</div>
        </div>
        <!-- 第5个小灯 -->
        <div class="light-box">
            <div class="light" id="light5"></div>
            <div class="light-label">灯 5</div>
        </div>
        <!-- 第6个小灯 -->
        <div class="light-box">
            <div class="light" id="light6"></div>
            <div class="light-label">灯 6</div>
        </div>
        <!-- 第7个小灯 -->
        <div class="light-box">
            <div class="light" id="light7"></div>
            <div class="light-label">灯 7</div>
        </div>
        <!-- 第8个小灯 -->
        <div class="light-box">
            <div class="light" id="light8"></div>
            <div class="light-label">灯 8</div>
        </div>
    </div>

    <!-- 错误提示 -->
    <div class="error-msg" id="errorMsg"></div>
</div>

<script>
    // 获取所有小灯的DOM元素，存入数组（相当于PLC中的输出寄存器 Q0.0 - Q0.7）
    const lights = [
        document.getElementById('light1'),
        document.getElementById('light2'),
        document.getElementById('light3'),
        document.getElementById('light4'),
        document.getElementById('light5'),
        document.getElementById('light6'),
        document.getElementById('light7'),
        document.getElementById('light8')
    ];

    // 核心控制逻辑（相当于PLC的梯形图程序）
    function processInput() {
        const inputField = document.getElementById('numInput');
        const errorMsg = document.getElementById('errorMsg');
        const inputValue = parseInt(inputField.value);

        // 清除之前的错误信息
        errorMsg.textContent = "";

        // 1. 安全校验：检查是否输入了数字，以及是否在1-8之间
        if (isNaN(inputValue)) {
            errorMsg.textContent = "错误：请输入有效的数字！";
            return;
        }
        if (inputValue < 1 || inputValue > 8) {
            errorMsg.textContent = "错误：输入范围必须在 1 到 8 之间！";
            return;
        }

        // 2. 先复位所有小灯（PLC中的清零操作）
        resetLights();

        // 3. 点亮对应的小灯（PLC中的置位操作）
        // 数组索引从0开始，所以输入1对应索引0，输入8对应索引7
        lights[inputValue - 1].classList.add('on');
    }

    // 复位功能（全部熄灭）
    function resetLights() {
        lights.forEach(light => {
            light.classList.remove('on');
        });
        document.getElementById('errorMsg').textContent = "";
    }

    // 支持按回车键直接执行
    document.getElementById('numInput').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            processInput();
        }
    });
</script>

</body>
</html>
